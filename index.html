      e.exercise = document.getElementById("edit-exercise").value.trim();
      const reps = Number(document.getElementById("edit-reps").value);
      const weight = Number(document.getElementById("edit-weight").value);
      if (reps > 0) e.reps = reps;
      if (weight > 0) e.weight = weight;
    } else {
      const ex = document.getElementById("edit-exercise").value.trim();
      if (ex) e.exercise = ex;
      const minutes = Number(document.getElementById("edit-minutes").value);
      if (minutes > 0) e.minutes = minutes;
    }
  } else if (editing.kind === "weight") {
    const w = weightEntries.find(x => x.date === editing.date);
    const newDate = document.getElementById("edit-date").value || w.date;
    const newVal = parseFloat(document.getElementById("edit-weight").value);
    if (newVal > 0) {
      weightEntries = weightEntries.filter(x => x.date !== editing.date && x.date !== newDate);
      weightEntries.unshift({ date: newDate, weight: newVal });
    }
  } else if (editing.kind === "meal") {
    const m = mealEntries.find(x => x.id === editing.id);
    m.date = document.getElementById("edit-date").value || m.date;
    m.mealType = editing.tempMealType;
    const text = document.getElementById("edit-text").value.trim();
    if (text) m.text = text;
    const cal = document.getElementById("edit-calories").value;
    m.calories = cal ? Number(cal) : null;
    m.protein = Number(document.getElementById("edit-protein").value) || 0;
    m.fat = Number(document.getElementById("edit-fat").value) || 0;
    m.carb = Number(document.getElementById("edit-carb").value) || 0;
  }
  editing = null;
  saveState(); renderTabContent(); renderEditModal(); scheduleSync();
}
function handleEditDelete() {
  if (editing.kind === "training") entries = entries.filter(x => x.id !== editing.id);
  else if (editing.kind === "weight") weightEntries = weightEntries.filter(x => x.date !== editing.date);
  else if (editing.kind === "meal") mealEntries = mealEntries.filter(x => x.id !== editing.id);
  editing = null;
  saveState(); renderTabContent(); renderEditModal(); scheduleSync();
}

// ============ ACTIONS ============
function handleAddTraining() {
  const date = document.getElementById("date-input").value || localDateStr();
  if (trainingSubTab === "strength") {
    const reps = document.getElementById("reps-input").value;
    if (!reps) return;
    const exercise = document.getElementById("exercise-input").value.trim();
    const weight = Number(document.getElementById("weight-input").value) || 0;
    entries.unshift({
      id: uid(), date, type: "strength", createdAt: Date.now(),
      part: selectedPart, exercise, reps: Number(reps), weight,
    });
    // 次回この種目(または部位)を選んだときに、今回の回数・負荷を提案できるよう覚えておく。
    lastStrengthByExercise[exercise || `(${selectedPart})`] = { reps: Number(reps), weight };
  } else {
    const minutes = document.getElementById("minutes-input").value;
    if (!minutes) return;
    const customVal = document.getElementById("cardio-custom-input").value.trim();
    if (selectedCardio === "その他" && !customVal) return;
    const exercise = selectedCardio === "その他" ? customVal : selectedCardio;
    entries.unshift({
      id: uid(), date, type: "cardio", createdAt: Date.now(),
      exercise, minutes: Number(minutes),
    });
    // 次回同じ種目を選んだときに、今回の時間を提案できるよう覚えておく。
    lastCardioMinutes[selectedCardio === "その他" ? customVal : selectedCardio] = Number(minutes);
  }
  selectedCardio = "ランニング";
  saveState(); renderTabContent(); scheduleSync();
}
function handleAddWeight() {
  const date = document.getElementById("weight-date-input").value || localDateStr();
  const val = parseFloat(document.getElementById("weight-value-input").value);
  if (!val || val <= 0) return;
  weightEntries = weightEntries.filter(w => w.date !== date);
  weightEntries.unshift({ date, weight: val });
  saveState(); renderTabContent(); scheduleSync();
}
function handleAddMeal() {
  const text = document.getElementById("meal-name-input").value.trim();
  if (!text) return;
  const date = document.getElementById("meal-date-input").value || localDateStr();
  const calories = document.getElementById("meal-cal-input").value;
  mealEntries.unshift({
    id: uid(), date, mealType: selectedMealType, text,
    calories: calories ? Number(calories) : null,
    protein: Number(document.getElementById("meal-protein-input").value) || 0,
    fat: Number(document.getElementById("meal-fat-input").value) || 0,
    carb: Number(document.getElementById("meal-carb-input").value) || 0,
    createdAt: Date.now(),
  });
  saveState(); renderTabContent(); scheduleSync();
}

// ============ 毎日の入力を楽にするためのショートカット機能 ============
// 履歴の各行にある「🔁」ボタン用: そのトレーニング/食事の内容をそのまま、
// 今日の日付で新しい記録として複製する(元の記録は消えない)。
function relogTraining(id) {
  const src = entries.find(x => x.id === id);
  if (!src) return;
  entries.unshift({ ...src, id: uid(), date: localDateStr(), createdAt: Date.now() });
  saveState(); renderTabContent(); scheduleSync();
}
function relogMeal(id) {
  const src = mealEntries.find(x => x.id === id);
  if (!src) return;
  mealEntries.unshift({ ...src, id: uid(), date: localDateStr(), createdAt: Date.now() });
  saveState(); renderTabContent(); scheduleSync();
}
// 「今日」タブ用: 昨日記録したトレーニング・食事をまとめて今日にコピーする。
function yesterdayDateStr() { return localDateStr(new Date(Date.now() - 86400000)); }
function yesterdayHasRecords() {
  const y = yesterdayDateStr();
  return entries.some(e => e.date === y) || mealEntries.some(m => m.date === y);
}
function copyYesterdayToToday() {
  const y = yesterdayDateStr(), today = localDateStr();
  entries.filter(e => e.date === y).forEach(e => entries.unshift({ ...e, id: uid(), date: today, createdAt: Date.now() }));
  mealEntries.filter(m => m.date === y).forEach(m => mealEntries.unshift({ ...m, id: uid(), date: today, createdAt: Date.now() }));
  saveState(); renderTabContent(); scheduleSync();
}
// 運動だけ/食事区分(朝食・昼食・夕食・間食)だけ、を個別にコピーしたいという要望向け。
function copyYesterdayTraining() {
  const y = yesterdayDateStr(), today = localDateStr();
  entries.filter(e => e.date === y).forEach(e => entries.unshift({ ...e, id: uid(), date: today, createdAt: Date.now() }));
  saveState(); renderTabContent(); scheduleSync();
}
function copyYesterdayMealType(mealType) {
  const y = yesterdayDateStr(), today = localDateStr();
  mealEntries.filter(m => m.date === y && m.mealType === mealType).forEach(m => mealEntries.unshift({ ...m, id: uid(), date: today, createdAt: Date.now() }));
  saveState(); renderTabContent(); scheduleSync();
}
function yesterdayMealTypesAvailable() {
  const y = yesterdayDateStr();
  return MEAL_TYPES.filter(t => mealEntries.some(m => m.date === y && m.mealType === t));
}
// 「よく使う運動メニュー」: 今日すでに記録した筋トレ・有酸素の内容を、名前を付けて
// テンプレートとして保存する。次回はワンタップでまとめて記録できる。
function saveTodayAsRoutine(name) {
  const today = localDateStr();
  const todays = entries.filter(e => e.date === today);
  if (!todays.length || !name) return;
  const items = todays.map(e => e.type === "strength"
    ? { type:"strength", part:e.part, exercise:e.exercise||"", weight:e.weight, reps:e.reps }
    : { type:"cardio", exercise:e.exercise, minutes:e.minutes });
  routineMaster.push({ id: uid(), name, items });
  saveState();
}
function applyRoutine(routineId) {
  const r = routineMaster.find(x => x.id === routineId);
  if (!r) return;
  const today = localDateStr();
  r.items.forEach(it => {
    if (it.type === "strength") entries.unshift({ id: uid(), type:"strength", date: today, part: it.part, exercise: it.exercise, weight: it.weight, reps: it.reps, createdAt: Date.now() });
    else entries.unshift({ id: uid(), type:"cardio", date: today, exercise: it.exercise, minutes: it.minutes, createdAt: Date.now() });
  });
  saveState(); renderTabContent(); scheduleSync();
}

// ============ EVENTS (bound once; #app content is replaced via innerHTML, so delegation is required) ============
document.getElementById("app").addEventListener("click", (e) => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { switchTab(tabBtn.dataset.tab); return; }

  const t = e.target.closest("[data-action]");
  if (!t) return;
  const action = t.dataset.action;
  const today = localDateStr();

  if (action === "go-settings") { switchTab("settings"); }
  else if (action === "set-mood") { moodByDate[today] = t.dataset.val; saveState(); renderTabContent(); }
  else if (action === "quicklog-workout") {
    const w = pickWorkout(moodByDate[today]);
    if (w.type === "strength") {
      trainingSubTab = "strength";
      switchTab("training");
      selectedPart = w.part;
      renderTrainingFormOptions();
      if (w.exercise) document.getElementById("exercise-input").value = w.exercise;
      const repsInput = document.getElementById("reps-input");
      repsInput.value = w.reps;
      repsInput.scrollIntoView({ behavior: "smooth", block: "center" });
    } else {
      // cardio, and the cardio portion of a combo suggestion (the strength
      // half of a combo is shown in the recommendation text; log it separately
      // from the training tab's 筋トレ sub-tab).
      trainingSubTab = "cardio";
      switchTab("training");
      selectedCardio = "その他";
      renderTrainingFormOptions();
      const customInput = document.getElementById("cardio-custom-input");
      customInput.value = w.type === "combo" ? w.cardioName : w.name;
      document.getElementById("minutes-input").value = w.type === "combo" ? w.cardioMin : w.min;
      customInput.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
  else if (action === "select-training-type") { trainingSubTab = t.dataset.val; renderTabContent(); }
  else if (action === "select-part") { selectedPart = t.dataset.val; renderTrainingFormOptions(); }
  else if (action === "select-exercise") { document.getElementById("exercise-input").value = t.dataset.val; renderTrainingFormOptions(); }
  else if (action === "select-cardio") { selectedCardio = t.dataset.val; renderTrainingFormOptions(); }
  else if (action === "weight-step") {
    const inp = document.getElementById("weight-input");
    if (!inp) return;
    const delta = Number(t.dataset.val);
    const v = Math.max(0, Math.round(((Number(inp.value) || 0) + delta) * 2) / 2);
    inp.value = v;
  }
  else if (action === "select-reps") {
    const repsInput = document.getElementById("reps-input");
    if (!repsInput) return;
    repsInput.value = t.dataset.val;
    delete repsInput.dataset.autofilled;
    renderTrainingFormOptions();
  }
  else if (action === "add-training") { handleAddTraining(); }
  else if (action === "reset-entry-date") { entryDates[t.dataset.kind] = null; updateEntryDateNotice(t.dataset.kind); }
  else if (action === "view-list") { historyView = "list"; renderHistory(); }
  else if (action === "view-calendar") { historyView = "calendar"; renderHistory(); }
  else if (action === "cal-prev") { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); renderHistory(); }
  else if (action === "cal-next") { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); renderHistory(); }
  else if (action === "select-day") { selectedCalDate = t.dataset.date; renderHistory(); }
  else if (action === "select-meal-type") {
    selectedMealType = t.dataset.val;
    document.querySelectorAll("#meal-type-buttons .chip").forEach(c => c.classList.toggle("active", c.dataset.val === t.dataset.val));
  }
  else if (action === "select-meal-preset") {
    const m = mealMaster.find(x => x.id === t.dataset.id);
    if (!m) return;
    document.getElementById("meal-name-input").value = m.name;
    document.getElementById("meal-cal-input").value = m.calories != null ? m.calories : "";
    document.getElementById("meal-protein-input").value = m.protein || "";
    document.getElementById("meal-fat-input").value = m.fat || "";
    document.getElementById("meal-carb-input").value = m.carb || "";
    document.getElementById("meal-name-suggestions").innerHTML = "";
    openMealDetail();
  }
  else if (action === "apply-food-suggestion") { applyFoodSuggestion(t.dataset.target, Number(t.dataset.idx)); }
  else if (action === "ai-lookup-nutrition") { aiLookupNutrition(t.dataset.target); }
  else if (action === "save-food-to-master") { saveFoodToMaster(t.dataset.target); }
  else if (action === "toggle-meal-detail") {
    mealDetailOpen = !mealDetailOpen;
    const detailEl = document.getElementById("meal-detail-fields");
    if (detailEl) detailEl.classList.toggle("hidden", !mealDetailOpen);
    t.textContent = (mealDetailOpen ? "▾" : "▸") + " 栄養素も入力(任意)";
  }
  else if (action === "add-meal") { handleAddMeal(); }
  else if (action === "add-weight") { handleAddWeight(); }
  else if (action === "edit-training") { openEdit("training", t.dataset.id); }
  else if (action === "edit-weight") { openEdit("weight", t.dataset.date); }
  else if (action === "edit-meal") { openEdit("meal", t.dataset.id); }
  else if (action === "del-training") { entries = entries.filter(x => x.id !== t.dataset.id); saveState(); renderTabContent(); scheduleSync(); }
  else if (action === "del-weight") { weightEntries = weightEntries.filter(w => w.date !== t.dataset.date); saveState(); renderTabContent(); scheduleSync(); }
  else if (action === "del-meal") { mealEntries = mealEntries.filter(m => m.id !== t.dataset.id); saveState(); renderTabContent(); scheduleSync(); }
  else if (action === "relog-training") { relogTraining(t.dataset.id); }
  else if (action === "relog-meal") { relogMeal(t.dataset.id); }
  else if (action === "copy-yesterday") { copyYesterdayToToday(); }
  else if (action === "copy-yesterday-training") { copyYesterdayTraining(); }
  else if (action === "copy-yesterday-meal") { copyYesterdayMealType(t.dataset.val); }
  else if (action === "save-routine-start") { savingRoutine = true; renderTabContent(); }
  else if (action === "save-routine-cancel") { savingRoutine = false; renderTabContent(); }
  else if (action === "save-routine-confirm") {
    const nameInp = document.getElementById("routine-name-input");
    const name = nameInp ? nameInp.value.trim() : "";
    if (!name) return;
    saveTodayAsRoutine(name);
    savingRoutine = false;
    renderTabContent();
  }
  else if (action === "apply-routine") { applyRoutine(t.dataset.id); }
  else if (action === "del-routine") { routineMaster = routineMaster.filter(r => r.id !== t.dataset.id); saveState(); renderTabContent(); }
  else if (action === "set-gender") { profile.gender = t.dataset.val; saveState(); renderTabContent(); }
  else if (action === "set-activity") { profile.activity = t.dataset.val; saveState(); renderTabContent(); }
  else if (action === "set-lifestyle") { profile.lifestyle = t.dataset.val; saveState(); renderTabContent(); }
  else if (action === "set-timeavail") { profile.timeAvail = t.dataset.val; saveState(); renderTabContent(); }
  else if (action === "retry-sync") { syncToSheet(); }
  else if (action === "fetch-ai-advice") { fetchAiAdvice(); }
  else if (action === "save-gas-config") {
    const urlEl = document.getElementById("gas-url-input");
    const tokenEl = document.getElementById("gas-token-input");
    const url = urlEl ? urlEl.value.trim() : "";
    const token = tokenEl ? tokenEl.value.trim() : "";
    gasConfig = { url, token };
    saveConfig();
    if (gasConfigured()) { syncStatus = "idle"; syncToSheet(); }
    else { syncStatus = "idle"; renderSyncStatus(); }
    renderTabContent();
  }
  else if (action === "export-json") { exportJson(); }
  // 復元(JSONから/シートから)は現在の記録を無条件に上書きするため、実行前に必ず
  // 確認ステップを挟む(confirmResetの「すべて削除」と同じ二段階確認パターン)。
  else if (action === "import-json") { confirmRestore = "file"; renderTabContent(); }
  else if (action === "restore-from-sheet") { confirmRestore = "sheet"; renderTabContent(); }
  else if (action === "restore-confirm-no") { confirmRestore = null; renderTabContent(); }
  else if (action === "restore-confirm-yes") {
    const kind = confirmRestore;
    confirmRestore = null;
    if (kind === "file") {
      const fileEl = document.getElementById("import-file-input");
      if (fileEl) fileEl.click();
      else renderTabContent();
    } else if (kind === "sheet") {
      restoreFromSheet();
    } else {
      renderTabContent();
    }
  }
  else if (action === "toggle-settings-section") {
    const key = t.dataset.val;
    settingsOpenSections[key] = !settingsOpenSections[key];
    const body = document.getElementById("settings-section-" + key);
    if (body) body.classList.toggle("hidden", !settingsOpenSections[key]);
    const chev = document.getElementById("settings-chevron-" + key);
    if (chev) chev.textContent = settingsOpenSections[key] ? "▾" : "▸";
  }
  else if (action === "select-master-ex-part") { masterExercisePart = t.dataset.val; renderMasterExerciseSection(); }
  else if (action === "add-exercise-master") {
    const inp = document.getElementById("master-ex-name-input");
    const name = inp.value.trim();
    if (!name) return;
    exerciseMaster.push({ id: uid(), part: masterExercisePart, name });
    inp.value = "";
    saveState(); renderMasterExerciseSection();
  }
  else if (action === "del-exercise-master") {
    exerciseMaster = exerciseMaster.filter(x => x.id !== t.dataset.id);
    saveState(); renderMasterExerciseSection();
  }
  else if (action === "add-meal-master") {
    const nameInp = document.getElementById("master-meal-name-input");
    const name = nameInp.value.trim();
    if (!name) return;
    const cal = document.getElementById("master-meal-cal-input").value;
    mealMaster.push({
      id: uid(), name,
      calories: cal ? Number(cal) : null,
      protein: Number(document.getElementById("master-meal-protein-input").value) || 0,
      fat: Number(document.getElementById("master-meal-fat-input").value) || 0,
      carb: Number(document.getElementById("master-meal-carb-input").value) || 0,
    });
    nameInp.value = "";
    document.getElementById("master-meal-cal-input").value = "";
    document.getElementById("master-meal-protein-input").value = "";
    document.getElementById("master-meal-fat-input").value = "";
    document.getElementById("master-meal-carb-input").value = "";
    document.getElementById("master-meal-name-suggestions").innerHTML = "";
    saveState(); renderMasterMealList();
  }
  else if (action === "del-meal-master") {
    mealMaster = mealMaster.filter(m => m.id !== t.dataset.id);
    saveState(); renderMasterMealList();
  }
  else if (action === "reset-show") { confirmReset = true; renderTabContent(); }
  else if (action === "reset-no") { confirmReset = false; renderTabContent(); }
  else if (action === "reset-yes") {
    entries = []; weightEntries = []; mealEntries = []; goals = { weight: 65, weeklyFreq: 3 };
    profile = null; moodByDate = {}; confirmReset = false; onboardStep = 0;
    exerciseMaster = []; mealMaster = []; masterExercisePart = "胸";
    lastStrengthByExercise = {}; lastCardioMinutes = {}; mealDetailOpen = false;
    entryDates = { meal: null, weight: null, training: null };
    routineMaster = []; savingRoutine = false;
    nutritionCache = {}; saveNutritionCache();
    seedExerciseMasterIfEmpty();
    onboardDraft = { age:"", gender:"男性", height:"", weight:"", goalWeight:"", activity:"週1-2回", timeAvail:"10-15分", weeklyFreq:"" };
    saveState(); renderApp();
  }
});
document.getElementById("app").addEventListener("input", (e) => {
  if (e.target.id === "meal-name-input") {
    renderFoodSuggestions("meal-name-suggestions", e.target.value, "meal");
  } else if (e.target.id === "master-meal-name-input") {
    renderFoodSuggestions("master-meal-name-suggestions", e.target.value, "master");
  } else if (e.target.id === "reps-input") {
    // ユーザーが自分で回数を書き換えたら、以後の自動提案で上書きしない。
    delete e.target.dataset.autofilled;
  }
});
// 日付欄を変えたら、その日付を覚えておく(1件記録するたびに今日へ戻らないように)。
document.getElementById("app").addEventListener("change", (e) => {
  const kind = e.target.dataset && e.target.dataset.entryDate;
  if (!kind) return;
  entryDates[kind] = e.target.value || null;
  // タブ全体を作り直すと入力途中の内容が消えるので、注意書きだけを差し替える。
  updateEntryDateNotice(kind);
});
document.getElementById("app").addEventListener("change", (e) => {
  if (e.target.id === "goal-weight-input") {
    const v = parseFloat(e.target.value);
    if (v > 0) { goals.weight = v; saveState(); renderTabContent(); }
  } else if (e.target.id === "goal-freq-input") {
    const v = parseInt(e.target.value, 10);
    if (v > 0) { goals.weeklyFreq = v; saveState(); renderTabContent(); }
  } else if (e.target.id === "profile-age-input") {
    profile.age = e.target.value; saveState(); renderTabContent();
  } else if (e.target.id === "profile-height-input") {
    profile.height = e.target.value; saveState(); renderTabContent();
  }
});
document.getElementById("app").addEventListener("change", (e) => {
  if (e.target.id === "import-file-input" && e.target.files && e.target.files[0]) {
    importJsonFile(e.target.files[0]);
    e.target.value = "";
  }
});
document.getElementById("app").addEventListener("click", (e) => {
  if (e.target.closest("#sync-status") && syncStatus === "error") syncToSheet();
});
document.getElementById("modal-root").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") { editing = null; renderEditModal(); return; }
  const suggestionBtn = e.target.closest('[data-action="apply-food-suggestion"]');
  if (suggestionBtn) { applyFoodSuggestion(suggestionBtn.dataset.target, Number(suggestionBtn.dataset.idx)); return; }
  const aiLookupBtn = e.target.closest('[data-action="ai-lookup-nutrition"]');
  if (aiLookupBtn) { aiLookupNutrition(aiLookupBtn.dataset.target); return; }
  const saveMasterBtn = e.target.closest('[data-action="save-food-to-master"]');
  if (saveMasterBtn) { saveFoodToMaster(saveMasterBtn.dataset.target); return; }
  const t = e.target.closest("[data-edit-action]");
  if (!t) return;
  const action = t.dataset.editAction;
  if (action === "dismiss") { editing = null; renderEditModal(); }
  else if (action === "set-part") { editing.tempPart = t.dataset.val; renderEditModal(); }
  else if (action === "set-exercise") { editing.draftExercise = t.dataset.val; renderEditModal(); }
  else if (action === "set-mealtype") { editing.tempMealType = t.dataset.val; renderEditModal(); }
  else if (action === "save") { handleEditSave(); }
  else if (action === "delete") { handleEditDelete(); }
});

// ============ INIT ============
selectedCalDate = localDateStr();
loadConfig();
loadState();
loadAiAdvice();
loadNutritionCache();
// 未送信の変更を残したままアプリを閉じないよう、離脱時にまとめて送る。
window.addEventListener("pagehide", flushSync);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSync(); });
if (!profile) {
  // Returning user upgrading from a version without the AI profile: prefill the
  // onboarding draft from whatever they already recorded, so they aren't asked
  // to re-enter their existing goal weight / weekly frequency from scratch.
  const latestWeight = [...weightEntries].sort((a,b) => a.date < b.date ? 1 : -1)[0];
  if (latestWeight) onboardDraft.weight = String(latestWeight.weight);
  if (goals.weight) onboardDraft.goalWeight = String(goals.weight);
  if (goals.weeklyFreq) onboardDraft.weeklyFreq = String(goals.weeklyFreq);
}
renderApp();
</script>
