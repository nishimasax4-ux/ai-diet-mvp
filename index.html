<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Log">
<title>TRAINING LOG</title>
<style>
  :root {
    --paper:#EDEAE0; --paper-dark:#E2DED2; --ink:#2B2B2E; --ink-faint:#6E6B62;
    --line:#B9C4C2; --steel:#5B6B73; --rust:#A24936; --brass:#9C7C46; --moss:#6B7A4F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--paper);
    background-image: repeating-linear-gradient(var(--paper), var(--paper) 27px, #B9C4C255 28px);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    color: var(--ink);
  }
  #app { max-width: 480px; margin: 0 auto; padding: 24px 20px 96px; }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: 0.15em; margin: 0; font-family: "Arial Narrow", Arial, sans-serif; }
  .subtitle { font-size: 12px; color: var(--ink-faint); margin: 4px 0 8px; }
  .mono { font-family: "Courier New", monospace; }
  .card { background: #FFFFFF; border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { display: flex; align-items: center; justify-content: space-between; }
  .wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .label { font-size: 11px; font-weight: 600; color: var(--ink-faint); display: block; margin-bottom: 4px; }
  input, select {
    background: #FFFFFF; border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 8px 10px; font-size: 14px; width: 100%;
  }
  .chip { padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 500; border: none; background: var(--paper-dark); color: var(--ink); }
  .chip.active-rust { background: var(--rust); color: #fff; }
  .chip.active-steel { background: var(--steel); color: #fff; }
  .chip.active-moss { background: var(--moss); color: #fff; }
  .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); font-weight: 600; font-size: 14px; }
  .tab-btn.active-strength { background: var(--rust); color: #fff; border-color: var(--rust); }
  .tab-btn.active-cardio { background: var(--steel); color: #fff; border-color: var(--steel); }
  button { cursor: pointer; font-family: inherit; }
  .btn-primary { width: 100%; padding: 11px; border-radius: 10px; border: none; background: var(--ink); color: var(--paper); font-weight: 700; letter-spacing: 0.03em; font-size: 14px; }
  .btn-icon { border: none; border-radius: 10px; padding: 0 14px; display: flex; align-items: center; justify-content: center; color: #fff; }
  .entry-row { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; }
  .badge { border-radius: 999px; padding: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .del-btn { background: none; border: none; color: var(--ink-faint); flex-shrink: 0; font-size: 14px; padding: 4px; }
  .streak-dot { width: 14px; height: 14px; border-radius: 999px; border: 1.5px solid var(--line); }
  .streak-dot.filled { background: var(--rust); border-color: var(--rust); }
  .section-title { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--ink-faint); margin: 0 0 8px; }
  .muted { font-size: 13px; color: var(--ink-faint); }
  #sync-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-faint); background: none; border: none; padding: 0; margin-bottom: 16px; }
  #sync-status.error { color: var(--rust); }
  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }

  /* ---- goals / progress ---- */
  .meter-track { height: 8px; border-radius: 999px; background: var(--paper-dark); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 999px; transition: width .25s ease; }

  /* ---- calendar ---- */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell { aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; border: 1px solid transparent; cursor: pointer; background: var(--paper); }
  .cal-cell.today { border-color: var(--ink); font-weight: 700; }
  .cal-cell.selected { background: var(--paper-dark); border-color: var(--line); }
  .cal-dots { display: flex; gap: 2px; margin-top: 2px; min-height: 5px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 999px; }

  /* ---- edit modal ---- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,18,14,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-card { background: #FFFFFF; width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; }
</style>
</head>
<body>
<div id="app">
  <h1>TRAINING LOG</h1>
  <p class="subtitle">記録帳 — <span id="header-date"></span></p>
  <button id="sync-status"></button>

  <div class="card" id="streak-card"></div>
  <div class="card" id="ai-card"></div>
  <div class="card" id="goals-card"></div>
  <div class="card" id="weight-card"></div>
  <div class="card" id="meal-card"></div>
  <div class="card" id="progress-card"></div>

  <div class="row" style="margin-bottom:16px;">
    <button class="tab-btn" id="tab-strength-btn">🏋️ 筋トレ</button>
    <button class="tab-btn" id="tab-cardio-btn">💨 有酸素</button>
  </div>

  <div class="card">
    <div style="margin-bottom:10px;">
      <label class="label">日付</label>
      <input type="date" id="date-input">
    </div>

    <div id="strength-fields">
      <div style="margin-bottom:10px;">
        <label class="label">部位</label>
        <div class="wrap" id="part-buttons"></div>
      </div>
      <div style="margin-bottom:10px;">
        <label class="label">種目(任意)</label>
        <div class="wrap" id="exercise-buttons" style="margin-bottom:8px;"></div>
        <input type="text" id="exercise-input" placeholder="例: ベンチプレス(空欄可・自由入力もOK)">
      </div>
      <div class="row" style="margin-bottom:10px;">
        <div style="flex:1;">
          <label class="label">回数</label>
          <input type="number" inputmode="numeric" id="reps-input" placeholder="回" class="mono">
        </div>
        <div style="flex:1;">
          <label class="label">負荷 (kg)</label>
          <select id="weight-select" class="mono"></select>
        </div>
      </div>
    </div>

    <div id="cardio-fields" class="hidden">
      <div style="margin-bottom:10px;">
        <label class="label">種目</label>
        <div class="wrap" id="cardio-buttons"></div>
        <input type="text" id="cardio-custom-input" placeholder="種目名を入力" class="hidden" style="margin-top:8px;">
      </div>
      <div style="margin-bottom:10px;">
        <label class="label">時間 (分)</label>
        <input type="number" inputmode="numeric" id="minutes-input" placeholder="分" class="mono">
      </div>
    </div>

    <button class="btn-primary" id="save-btn">＋ 記録する</button>
  </div>

  <div id="history-section"></div>

  <div id="reset-area" style="margin-top:32px; text-align:center;"></div>
</div>

<div id="modal-root" class="hidden"></div>

<script>
// ============ CONFIG ============
// Google Apps Script Webアプリの URL をここに貼り付けてください(README参照)
const GAS_URL = "PUT_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

const STORAGE_KEY = "training-log-data";
const PARTS = ["胸","背中","脚","肩","腕","腹筋"];
const EXERCISES_BY_PART = {
  "胸": ["ベンチプレス","インクラインプレス","ダンベルフライ","プッシュアップ"],
  "背中": ["懸垂","ラットプルダウン","デッドリフト","ベントオーバーロウ"],
  "脚": ["スクワット","レッグプレス","ランジ","レッグカール"],
  "肩": ["ショルダープレス","サイドレイズ","アップライトロウ"],
  "腕": ["アームカール","トライセップエクステンション","ハンマーカール"],
  "腹筋": ["クランチ","プランク","レッグレイズ"],
};
const CARDIO_OPTIONS = ["ランニング","バイク","ウォーキング","その他"];
const WEIGHTS = [15,20,25,30,35,40,45,50];
const MEAL_TYPES = ["朝食","昼食","夕食","間食"];
const WEEKDAY = ["日","月","火","水","木","金","土"];

// ---- AIアドバイス関連 ----
const ACTIVITY_LEVELS = ["ほぼなし","週1-2回","週3-4回","ほぼ毎日"];
const TIME_LEVELS = ["5-10分","10-15分","15-30分","30分以上"];
const ACTIVITY_FACTOR = { "ほぼなし":1.2, "週1-2回":1.375, "週3-4回":1.55, "ほぼ毎日":1.725 };
const TIME_TO_LEVEL = { "5-10分":"low", "10-15分":"medium", "15-30分":"high", "30分以上":"high" };
const WORKOUTS = {
  low: [
    { name:"ストレッチ&深呼吸", min:5, intensity:"ゆるめ" },
    { name:"その場足踏み", min:8, intensity:"ゆるめ" },
    { name:"軽い散歩", min:10, intensity:"ゆるめ" },
  ],
  medium: [
    { name:"自重スクワット 3セット", min:10, intensity:"ふつう" },
    { name:"ウォーキング", min:15, intensity:"ふつう" },
    { name:"プランク&腕立て", min:12, intensity:"ふつう" },
  ],
  high: [
    { name:"HIIT風サーキット", min:15, intensity:"しっかりめ" },
    { name:"ジョギング", min:20, intensity:"しっかりめ" },
    { name:"自重トレーニング フルセット", min:20, intensity:"しっかりめ" },
  ],
};

// ============ STATE ============
let entries = [];
let weightEntries = [];
let mealEntries = [];
let goals = { weight: 65, weeklyFreq: 3 };
let profile = { age: "", gender: "男性", height: "", activity: "週1-2回", timeAvail: "10-15分" };
let moodByDate = {};
let currentTab = "strength";
let selectedPart = "胸";
let selectedCardio = "ランニング";
let selectedMealType = "朝食";
let syncStatus = "idle"; // idle | syncing | synced | error
let lastSyncedAt = null;
let confirmReset = false;

let historyView = "list"; // list | calendar
let calMonth = (() => { const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();
let selectedCalDate = null; // set on init
let progressExercise = null;
let editing = null; // {kind:'training', id} | {kind:'weight', date} | {kind:'meal', id}

// ============ HELPERS ============
function localDateStr(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function calcStreak(list) {
  const dateSet = new Set(list.map(e => e.date));
  let streak = 0, cur = new Date();
  while (dateSet.has(localDateStr(cur))) { streak++; cur.setDate(cur.getDate()-1); }
  return streak;
}
function last7Days() {
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate()-i); days.push(d); }
  return days;
}
function weekBuckets(n) {
  const now = new Date();
  const dow = now.getDay();
  const diffToMonday = (dow === 0 ? 6 : dow - 1);
  const thisMonday = new Date(now); thisMonday.setDate(now.getDate() - diffToMonday); thisMonday.setHours(0,0,0,0);
  const trainedDates = new Set(entries.map(e => e.date));
  const buckets = [];
  for (let w = n - 1; w >= 0; w--) {
    const start = new Date(thisMonday); start.setDate(thisMonday.getDate() - w*7);
    let count = 0;
    for (let i = 0; i < 7; i++) { const d = new Date(start); d.setDate(start.getDate()+i); if (trainedDates.has(localDateStr(d))) count++; }
    buckets.push({ start, label: `${start.getMonth()+1}/${start.getDate()}`, count });
  }
  return buckets;
}
function uid() { return `${Date.now()}-${Math.random().toString(36).slice(2,8)}`; }
function dayOfYear(d) { const start = new Date(d.getFullYear(), 0, 0); return Math.floor((d - start) / 86400000); }
function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      entries = data.entries || [];
      weightEntries = data.weightEntries || [];
      mealEntries = data.mealEntries || [];
      if (data.goals) goals = Object.assign({}, goals, data.goals);
      if (data.profile) profile = Object.assign({}, profile, data.profile);
      moodByDate = data.moodByDate || {};
    }
  } catch (e) { console.error("load error", e); }
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ entries, weightEntries, mealEntries, goals, profile, moodByDate }));
  } catch (e) { console.error("save error", e); }
}

function buildRows() {
  const rows = [];
  entries.forEach(e => {
    if (e.type === "strength") {
      rows.push([e.date, "筋トレ", e.part, e.exercise || "", `${e.weight}kg`, `${e.reps}回`]);
    } else {
      rows.push([e.date, "有酸素", e.exercise, `${e.minutes}分`, "", ""]);
    }
  });
  weightEntries.forEach(w => rows.push([w.date, "体重", `${w.weight}kg`, "", "", ""]));
  mealEntries.forEach(m => {
    const pfc = (m.protein || m.fat || m.carb) ? `P${m.protein||0} F${m.fat||0} C${m.carb||0}` : "";
    rows.push([m.date, "食事", m.mealType, m.text, m.calories ? `${m.calories}kcal` : "", pfc]);
  });
  rows.sort((a,b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  return rows;
}

async function syncToSheet() {
  if (!GAS_URL || GAS_URL.indexOf("PUT_YOUR") === 0) { syncStatus = "idle"; renderSyncStatus(); return; }
  syncStatus = "syncing"; renderSyncStatus();
  try {
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight on Apps Script
      body: JSON.stringify({ rows: buildRows() }),
    });
    const data = await res.json();
    if (data && data.status === "ok") {
      syncStatus = "synced"; lastSyncedAt = new Date();
    } else {
      syncStatus = "error";
    }
  } catch (e) {
    syncStatus = "error";
  }
  renderSyncStatus();
}

// ============ CHART HELPERS ============
// Generic 2-px line chart: points = [{date, value}], optional dashed goal line.
function lineChartSvg(points, colorHex, goalValue) {
  if (points.length < 2) {
    return '<p class="muted" style="font-size:12px;">データが2件以上になるとグラフが表示されます。</p>';
  }
  const w = 300, h = 100, pad = 8;
  const values = points.map(p => p.value).concat(goalValue != null ? [goalValue] : []);
  const min = Math.min(...values) - 1, max = Math.max(...values) + 1;
  const xStep = (w - pad*2) / (points.length - 1);
  const yFor = v => h - pad - ((v - min) / (max - min)) * (h - pad*2);
  const linePoints = points.map((p,i) => `${pad + i*xStep},${yFor(p.value)}`).join(" ");
  const dots = points.map((p,i) => `<circle cx="${pad+i*xStep}" cy="${yFor(p.value)}" r="4" fill="${colorHex}" stroke="#fff" stroke-width="2"/>`).join("");
  const goalLine = goalValue != null
    ? `<line x1="${pad}" y1="${yFor(goalValue)}" x2="${w-pad}" y2="${yFor(goalValue)}" stroke="var(--brass)" stroke-dasharray="4 4" stroke-width="1"/>`
    : "";
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:110px;">
    ${goalLine}
    <polyline points="${linePoints}" fill="none" stroke="${colorHex}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}
function topRoundedPath(x, y, width, height, r) {
  if (height <= 0) return "";
  r = Math.min(r, width/2, height);
  return `M${x},${y+height} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+width-r},${y} Q${x+width},${y} ${x+width},${y+r} L${x+width},${y+height} Z`;
}
// Weekly frequency bar chart with a dashed goal line.
function weeklyBarSvg(weeks, goal) {
  const w = 300, h = 100, pad = 8, labelH = 12;
  const maxVal = Math.max(...weeks.map(x => x.count), goal, 1);
  const plotH = h - pad - labelH;
  const slot = (w - pad*2) / weeks.length;
  const bw = Math.min(24, slot - 6);
  const yFor = v => pad + plotH - (v / maxVal) * plotH;
  const goalY = yFor(goal);
  const bars = weeks.map((wk, i) => {
    const slotX = pad + i*slot;
    const x = slotX + (slot - bw) / 2;
    const y = yFor(wk.count);
    const barH = (pad + plotH) - y;
    const achieved = wk.count >= goal && goal > 0;
    return `<path d="${topRoundedPath(x, y, bw, barH, 4)}" fill="${achieved ? "var(--moss)" : "#6B7A4F66"}"/>`;
  }).join("");
  const labels = weeks.map((wk, i) => {
    const slotX = pad + i*slot;
    return `<text x="${slotX + slot/2}" y="${h-1}" font-size="7" fill="var(--ink-faint)" text-anchor="middle">${wk.label}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:110px;">
    <line x1="${pad}" y1="${goalY}" x2="${w-pad}" y2="${goalY}" stroke="var(--brass)" stroke-dasharray="4 4" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}

// ============ AI ADVICE HELPERS ============
// Rule-based "AI": no external AI API is called. Estimates a daily calorie/macro
// target from profile + latest recorded weight (Mifflin-St Jeor), and suggests a
// short workout based on today's mood + how much time the user has available.
function computeTargets(p, weight, goalWeight) {
  const age = Number(p.age), height = Number(p.height);
  if (!age || !height || !weight) return null;
  const bmr = p.gender === "男性"
    ? 10*weight + 6.25*height - 5*age + 5
    : 10*weight + 6.25*height - 5*age - 161;
  const tdee = bmr * (ACTIVITY_FACTOR[p.activity] || 1.375);
  const diff = weight - (goalWeight != null ? goalWeight : weight);
  let targetCalories;
  if (diff > 0.5) targetCalories = tdee - (diff > 5 ? 500 : 300);
  else if (diff < -0.5) targetCalories = tdee + 300;
  else targetCalories = tdee;
  const floor = p.gender === "男性" ? 1500 : 1200;
  targetCalories = Math.max(targetCalories, floor, bmr*1.05);
  targetCalories = Math.round(targetCalories/10)*10;
  const targetProtein = Math.round(weight * 1.8);
  const targetFat = Math.round((targetCalories*0.25)/9);
  const targetCarb = Math.max(0, Math.round((targetCalories - targetProtein*4 - targetFat*9)/4));
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), targetCalories, targetProtein, targetFat, targetCarb };
}
function getTargets() {
  const latestWeight = [...weightEntries].sort((a,b) => a.date < b.date ? 1 : -1)[0];
  if (!latestWeight) return null;
  return computeTargets(profile, latestWeight.weight, goals.weight);
}
function pickWorkout(mood) {
  const baseLevel = TIME_TO_LEVEL[profile.timeAvail] || "medium";
  let level = baseLevel;
  if (mood === "tired") level = "low";
  else if (mood === "energetic") level = baseLevel === "low" ? "medium" : "high";
  const pool = WORKOUTS[level];
  return pool[dayOfYear(new Date()) % pool.length];
}
function generateDailyAdvice() {
  const today = localDateStr();
  const mood = moodByDate[today];
  const parts = [];
  if (mood === "tired") parts.push("今日は疲れているようですね。トレーニングは軽めにして、無理のない範囲で過ごしましょう。");
  else if (mood === "energetic") parts.push("今日は調子が良さそうですね!予定より少しだけ負荷を上げてみましょう。");
  else if (!mood) parts.push("今日の調子を教えてください。それに合わせておすすめの運動を調整します。");
  else parts.push("いつも通りのペースで大丈夫です。");

  const targets = getTargets();
  if (targets) {
    const todayCal = mealEntries.filter(m => m.date === today).reduce((s,m) => s + (m.calories||0), 0);
    const remaining = targets.targetCalories - todayCal;
    if (todayCal > 0) {
      if (remaining < -100) parts.push(`カロリーは目標より${Math.abs(Math.round(remaining))}kcalほど多めですが、気にしすぎなくて大丈夫。明日以降で自然に調整できます。`);
      else if (remaining > targets.targetCalories*0.5) parts.push("まだ食事の記録が少なめです。しっかり栄養を摂りましょう。");
    }
  }
  return parts.join(" ");
}

// ============ RENDER ============
function renderSyncStatus() {
  const el = document.getElementById("sync-status");
  el.classList.toggle("error", syncStatus === "error");
  const icon = { idle: "☁️", syncing: '<span class="spin">🔄</span>', synced: "☁️", error: "⚠️" }[syncStatus];
  const text = {
    idle: GAS_URL.indexOf("PUT_YOUR") === 0 ? "Google Sheets 未設定" : "Google Sheets 未同期",
    syncing: "Google Sheetsに同期中...",
    synced: `Google Sheets 同期済み${lastSyncedAt ? ` (${String(lastSyncedAt.getHours()).padStart(2,"0")}:${String(lastSyncedAt.getMinutes()).padStart(2,"0")})` : ""}`,
    error: "同期エラー(タップして再試行)",
  }[syncStatus];
  el.innerHTML = `${icon} <span>${text}</span>`;
}

function renderStreak() {
  const streak = calcStreak(entries);
  const trainedDates = new Set(entries.map(e => e.date));
  const dots = last7Days().map(d => {
    const filled = trainedDates.has(localDateStr(d));
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
      <div class="streak-dot ${filled ? "filled" : ""}"></div>
      <span style="font-size:9px;color:var(--ink-faint);">${WEEKDAY[d.getDay()]}</span>
    </div>`;
  }).join("");
  document.getElementById("streak-card").innerHTML = `
    <div class="row">
      <span style="font-size:18px;">🔥</span>
      <div style="flex:1;">
        <div class="row" style="gap:4px;align-items:baseline;">
          <span class="mono" style="font-size:20px;font-weight:700;">${streak}</span>
          <span style="font-size:12px;color:var(--ink-faint);">日連続</span>
        </div>
        <div class="row" style="gap:6px;margin-top:6px;">${dots}</div>
      </div>
    </div>`;
}

        <span style="font-size:12px;">週間トレーニング目標</span>
        <div class="row" style="gap:4px;width:auto;">
          <input type="number" id="goal-freq-input" class="mono" value="${goals.weeklyFreq}" style="width:48px;padding:4px 6px;">
          <span style="font-size:12px;color:var(--ink-faint);">回/週</span>
        </div>
      </div>
      <div class="meter-track"><div class="meter-fill" style="width:${freqPct}%;background:var(--rust);"></div></div>
      <p class="muted" style="font-size:11px;margin:4px 0 0;">今週(月〜日) ${thisWeek.count} / ${goals.weeklyFreq} 回(達成率 ${freqPct}%)</p>
    </div>
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);">

        <input type="number" id="profile-height-input" placeholder="身長cm" class="mono" value="${esc(profile.height)}">
      </div>
      <div class="wrap" style="margin-bottom:8px;">
        ${["男性","女性"].map(g => `<button class="chip ${profile.gender===g?"active-rust":""}" data-action="set-gender" data-val="${g}">${g}</button>`).join("")}
      </div>
      <p class="muted" style="font-size:11px;margin:0 0 4px;">運動習慣</p>
      <div class="wrap" style="margin-bottom:8px;">
        ${ACTIVITY_LEVELS.map(a => `<button class="chip ${profile.activity===a?"active-rust":""}" data-action="set-activity" data-val="${a}">${a}</button>`).join("")}
      </div>

      <div class="wrap" style="margin-bottom:10px;">

             1日の目標: <span class="mono">${targets.targetCalories}</span>kcal(P${targets.targetProtein} F${targets.targetFat} C${targets.targetCarb})</p>`

function renderProgressCard() {
  const weeks = weekBuckets(8);

  const keyOf = e => e.exercise ? e.exercise : `(${e.part})`;
  const strengthEntries = entries.filter(e => e.type === "strength");
  const keys = [...new Set(strengthEntries.slice().sort((a,b) => b.createdAt - a.createdAt).map(keyOf))];
  if (!progressExercise || !keys.includes(progressExercise)) progressExercise = keys[0] || null;

  let exerciseSelect = "";
  let exerciseChart = '<p class="muted" style="font-size:12px;">筋トレを記録するとグラフが表示されます。</p>';
  if (progressExercise) {
    const byDate = {};
    strengthEntries.filter(e => keyOf(e) === progressExercise).forEach(e => {
      byDate[e.date] = Math.max(byDate[e.date] || 0, e.weight);
    });
    const points = Object.keys(byDate).sort().map(d => ({ date: d, value: byDate[d] }));
    exerciseChart = lineChartSvg(points, "#A24936", null);
    exerciseSelect = `<select id="progress-exercise-select" class="mono" style="margin-bottom:8px;">
      ${keys.map(k => `<option value="${esc(k)}" ${k===progressExercise?"selected":""}>${esc(k)}</option>`).join("")}
    </select>`;
  }

  document.getElementById("progress-card").innerHTML = `
    <p class="section-title" style="margin:0 0 8px;">📈 進捗</p>
    <p class="label" style="margin-bottom:4px;">週間トレーニング頻度(直近8週・点線は目標)</p>
    ${weeklyBarSvg(weeks, goals.weeklyFreq)}
    <p class="label" style="margin:14px 0 4px;">種目別 重量の推移</p>
    ${exerciseSelect}
    ${exerciseChart}`;

  const sel = document.getElementById("progress-exercise-select");
  if (sel) sel.addEventListener("change", (e) => { progressExercise = e.target.value; renderProgressCard(); });
}

  return `<div class="entry-row">

    <button class="del-btn" data-action="del-training" data-id="${e.id}">🗑️</button>
  </div>`;
}

function calendarGridHtml() {
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = localDateStr();
  const trainedDates = new Set(entries.map(e => e.date));
  const weightDates = new Set(weightEntries.map(w => w.date));
  const mealDates = new Set(mealEntries.map(m => m.date));

  let cells = "";
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell" style="visibility:hidden;"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dots = [];
    if (trainedDates.has(dateStr)) dots.push('<div class="cal-dot" style="background:var(--rust);"></div>');
    if (weightDates.has(dateStr)) dots.push('<div class="cal-dot" style="background:var(--brass);"></div>');
    if (mealDates.has(dateStr)) dots.push('<div class="cal-dot" style="background:var(--moss);"></div>');
    cells += `<div class="cal-cell ${dateStr===todayStr?"today":""} ${dateStr===selectedCalDate?"selected":""}" data-action="select-day" data-date="${dateStr}">
      <span>${d}</span><div class="cal-dots">${dots.join("")}</div>
    </div>`;
  }
  const weekHead = WEEKDAY.map(w => `<div style="text-align:center;font-size:10px;color:var(--ink-faint);">${w}</div>`).join("");
  return `
    <div class="between" style="margin-bottom:8px;">
      <button data-action="cal-prev" style="background:none;border:none;font-size:16px;padding:4px 10px;">‹</button>
      <span class="mono" style="font-weight:700;">${year}年${month+1}月</span>
      <button data-action="cal-next" style="background:none;border:none;font-size:16px;padding:4px 10px;">›</button>
    </div>
    <div class="cal-grid" style="margin-bottom:4px;">${weekHead}</div>
    <div class="cal-grid">${cells}</div>`;
}

function dayDetailHtml(dateStr) {
  const dd = new Date(dateStr + "T00:00:00");
  const dayEntries = entries.filter(e => e.date === dateStr);
  const dayWeight = weightEntries.find(w => w.date === dateStr);
  const dayMeals = mealEntries.filter(m => m.date === dateStr);
  const header = `<p class="mono" style="font-weight:700;font-size:13px;margin:14px 0 6px;">${dateStr}(${WEEKDAY[dd.getDay()]})</p>`;
  if (dayEntries.length === 0 && !dayWeight && dayMeals.length === 0) {
    return header + '<p class="muted" style="font-size:12px;">この日の記録はありません。</p>';
  }
  const trainingRows = dayEntries.map(trainingEntryRowHtml).join("");
  const weightRow = dayWeight ? `<div class="entry-row">
      <div class="badge" style="background:#9C7C4622;">⚖️</div>
      <div style="flex:1;">体重 <span class="mono" style="color:var(--brass);">${dayWeight.weight}kg</span></div>
      <button class="del-btn" data-action="edit-weight" data-date="${dayWeight.date}">✏️</button>
      <button class="del-btn" data-action="del-weight" data-date="${dayWeight.date}">🗑️</button>
    </div>` : "";
  const mealRows = dayMeals.map(m => `<div class="entry-row">
      <div class="badge" style="background:#6B7A4F22;">🍽️</div>
      <div style="flex:1;">[${esc(m.mealType)}] ${esc(m.text)}${m.calories ? ` <span class="mono" style="color:var(--ink-faint);">(${m.calories}kcal)</span>` : ""}</div>
      <button class="del-btn" data-action="edit-meal" data-id="${m.id}">✏️</button>
      <button class="del-btn" data-action="del-meal" data-id="${m.id}">🗑️</button>
    </div>`).join("");
  return header + trainingRows + weightRow + mealRows;
}

function renderHistory() {
  const toggle = `
    <div class="between" style="margin-bottom:8px;">
      <p class="section-title" style="margin:0;">履歴</p>
      <div class="row" style="gap:4px;width:auto;">
        <button class="chip ${historyView==="list"?"active-rust":""}" data-action="view-list">リスト</button>
        <button class="chip ${historyView==="calendar"?"active-rust":""}" data-action="view-calendar">カレンダー</button>
      </div>
    </div>`;

  let body;
  if (historyView === "calendar") {
    body = `<div class="card">${calendarGridHtml()}${dayDetailHtml(selectedCalDate)}</div>`;
  } else {
    const grouped = {};
    [...entries].sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.createdAt - a.createdAt)
      .forEach(e => { (grouped[e.date] = grouped[e.date] || []).push(e); });
    const dates = Object.keys(grouped);
    if (dates.length === 0) {
      body = '<p class="muted">まだ記録がありません。今日のトレーニングを記録してみましょう。</p>';
    } else {
      body = dates.map(d => {
        const dd = new Date(d + "T00:00:00");
        const items = grouped[d].map(trainingEntryRowHtml).join("");
        return `<div style="margin-bottom:14px;">
          <div class="row" style="gap:6px;align-items:baseline;margin-bottom:6px;">
            <span class="mono" style="font-weight:700;font-size:14px;">${d}</span>
            <span style="font-size:12px;color:var(--ink-faint);">(${WEEKDAY[dd.getDay()]})</span>
          </div>
          ${items}
        </div>`;
      }).join("");
    }
  }
  document.getElementById("history-section").innerHTML = toggle + body;
}

function renderReset() {
  const hasData = entries.length > 0 || weightEntries.length > 0 || mealEntries.length > 0;
  const el = document.getElementById("reset-area");
  if (!hasData) { el.innerHTML = ""; return; }
  el.innerHTML = confirmReset
    ? `<div style="font-size:12px;"><span>本当に削除しますか?</span>
        <button data-action="reset-yes" style="background:none;border:none;color:var(--rust);font-weight:700;margin-left:8px;">削除する</button>
        <button data-action="reset-no" style="background:none;border:none;color:var(--ink-faint);margin-left:8px;">キャンセル</button>
       </div>`
    : `<button data-action="reset-show" style="background:none;border:none;color:var(--ink-faint);font-size:12px;text-decoration:underline;">全データを削除</button>`;
}

function renderEditModal() {
  const el = document.getElementById("modal-root");
  if (!editing) { el.innerHTML = ""; el.classList.add("hidden"); return; }
  el.classList.remove("hidden");

  let body = "";
  if (editing.kind === "training") {
    const e = entries.find(x => x.id === editing.id);
    if (!e) { editing = null; el.innerHTML = ""; el.classList.add("hidden"); return; }
    if (e.type === "strength") {
      const exOptions = EXERCISES_BY_PART[editing.tempPart] || [];
      body = `
        <label class="label">部位</label>
        <div class="wrap" style="margin-bottom:10px;">${PARTS.map(p => `<button class="chip ${editing.tempPart===p?"active-rust":""}" data-edit-action="set-part" data-val="${p}">${p}</button>`).join("")}</div>
        <label class="label">種目(任意)</label>
        <div class="wrap" style="margin-bottom:8px;">${exOptions.map(ex => `<button class="chip ${editing.draftExercise===ex?"active-rust":""}" data-edit-action="set-exercise" data-val="${ex}">${ex}</button>`).join("")}</div>
        <input type="text" id="edit-exercise" value="${esc(editing.draftExercise||"")}" style="margin-bottom:10px;">
        <div class="row" style="margin-bottom:10px;">
          <div style="flex:1;"><label class="label">回数</label><input type="number" id="edit-reps" value="${editing.draftReps}" class="mono"></div>
          <div style="flex:1;"><label class="label">負荷(kg)</label><input type="number" id="edit-weight" value="${editing.draftWeight}" class="mono"></div>
        </div>
        <label class="label">日付</label><input type="date" id="edit-date" value="${editing.draftDate}" style="margin-bottom:14px;">`;
    } else {
      body = `
        <label class="label">種目</label><input type="text" id="edit-exercise" value="${esc(editing.draftExercise||"")}" style="margin-bottom:10px;">
        <label class="label">時間(分)</label><input type="number" id="edit-minutes" value="${editing.draftMinutes}" class="mono" style="margin-bottom:10px;">
        <label class="label">日付</label><input type="date" id="edit-date" value="${editing.draftDate}" style="margin-bottom:14px;">`;
    }
  } else if (editing.kind === "weight") {
    const w = weightEntries.find(x => x.date === editing.date);
    if (!w) { editing = null; el.innerHTML = ""; el.classList.add("hidden"); return; }
    body = `
      <label class="label">日付</label><input type="date" id="edit-date" value="${editing.draftDate}" style="margin-bottom:10px;">
      <label class="label">体重(kg)</label><input type="number" step="0.1" id="edit-weight" value="${editing.draftWeight}" class="mono" style="margin-bottom:14px;">`;
  } else if (editing.kind === "meal") {
    const m = mealEntries.find(x => x.id === editing.id);
    if (!m) { editing = null; el.innerHTML = ""; el.classList.add("hidden"); return; }
    body = `
      <label class="label">区分</label>
      <div class="wrap" style="margin-bottom:10px;">${MEAL_TYPES.map(t => `<button class="chip ${editing.tempMealType===t?"active-moss":""}" data-edit-action="set-mealtype" data-val="${t}">${t}</button>`).join("")}</div>
      <label class="label">内容</label><input type="text" id="edit-text" value="${esc(editing.draftText||"")}" style="margin-bottom:10px;">
      <label class="label">カロリー(任意)</label><input type="number" id="edit-calories" value="${editing.draftCalories||""}" class="mono" style="margin-bottom:10px;">
      <div class="row" style="margin-bottom:10px;">
        <input type="number" id="edit-protein" value="${editing.draftProtein||""}" placeholder="P(g)" class="mono">
        <input type="number" id="edit-fat" value="${editing.draftFat||""}" placeholder="F(g)" class="mono">
        <input type="number" id="edit-carb" value="${editing.draftCarb||""}" placeholder="C(g)" class="mono">
      </div>
      <label class="label">日付</label><input type="date" id="edit-date" value="${editing.draftDate}" style="margin-bottom:14px;">`;
  }

  el.innerHTML = `<div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <p class="section-title">記録を編集</p>
      ${body}
      <div class="row">
        <button class="btn-primary" data-edit-action="save" style="flex:1;">保存</button>
        <button class="btn-icon" style="background:var(--rust);" data-edit-action="delete">🗑️</button>
      </div>
      <button style="width:100%;background:none;border:none;color:var(--ink-faint);margin-top:8px;font-size:13px;padding:6px;" data-edit-action="dismiss">キャンセル</button>
    </div>
  </div>`;
  bindEditModalDraftInputs();
}

function renderAll() {
  document.getElementById("header-date").textContent = document.getElementById("date-input").value || localDateStr();
  renderSyncStatus();
  renderStreak();
  renderAiCard();
  renderGoalsCard();
  renderWeightCard();
  renderMealCard();
  renderProgressCard();
  renderTabs();
  renderFormOptions();
  renderHistory();
  renderReset();
  renderEditModal();
}

// ============ ACTIONS ============
function resetForm() {
  document.getElementById("exercise-input").value = "";
  document.getElementById("reps-input").value = "";
  document.getElementById("weight-select").value = "20";
  selectedCardio = "ランニング";
  document.getElementById("cardio-custom-input").value = "";
  document.getElementById("minutes-input").value = "";
}

function handleSave() {
  const date = document.getElementById("date-input").value || localDateStr();
  if (currentTab === "strength") {
    const reps = document.getElementById("reps-input").value;
    if (!reps) return;
    entries.unshift({
      id: uid(), date, type: "strength", createdAt: Date.now(),
      part: selectedPart,
      exercise: document.getElementById("exercise-input").value.trim(),
      reps: Number(reps),
      weight: Number(document.getElementById("weight-select").value),
    });
  } else {
    const minutes = document.getElementById("minutes-input").value;
    if (!minutes) return;
    const customVal = document.getElementById("cardio-custom-input").value.trim();
    if (selectedCardio === "その他" && !customVal) return;
    entries.unshift({
      id: uid(), date, type: "cardio", createdAt: Date.now(),
      exercise: selectedCardio === "その他" ? customVal : selectedCardio,
      minutes: Number(minutes),
    });
  }
  saveState();
  resetForm();
  renderAll();
  syncToSheet();
}

function handleAddWeight() {
  const date = document.getElementById("weight-date-input").value || localDateStr();
  const val = parseFloat(document.getElementById("weight-value-input").value);
  if (!val || val <= 0) return;
  weightEntries = weightEntries.filter(w => w.date !== date);
  weightEntries.unshift({ date, weight: val });
  document.getElementById("weight-value-input").value = "";
  saveState(); renderAll(); syncToSheet();
}

function handleAddMeal() {
  const text = document.getElementById("meal-text-input").value.trim();
  if (!text) return;
  const date = document.getElementById("meal-date-input").value || localDateStr();
  const calories = document.getElementById("meal-calories-input").value;
  mealEntries.unshift({
    id: uid(), date, mealType: selectedMealType, text,
    calories: calories ? Number(calories) : null,
    protein: Number(document.getElementById("meal-protein-input").value) || 0,
    fat: Number(document.getElementById("meal-fat-input").value) || 0,
    carb: Number(document.getElementById("meal-carb-input").value) || 0,
    createdAt: Date.now(),
  });
  document.getElementById("meal-text-input").value = "";
  document.getElementById("meal-calories-input").value = "";
  document.getElementById("meal-protein-input").value = "";
  document.getElementById("meal-fat-input").value = "";
  document.getElementById("meal-carb-input").value = "";
  saveState(); renderAll(); syncToSheet();
}

function openEdit(kind, key) {
  if (kind === "training") {
    const e = entries.find(x => x.id === key);
    if (!e) return;
    editing = e.type === "strength"
      ? { kind, id: key, tempPart: e.part, draftExercise: e.exercise || "", draftReps: e.reps, draftWeight: e.weight, draftDate: e.date }
      : { kind, id: key, draftExercise: e.exercise || "", draftMinutes: e.minutes, draftDate: e.date };
  } else if (kind === "weight") {
    const w = weightEntries.find(x => x.date === key);
    if (!w) return;
    editing = { kind, date: key, draftWeight: w.weight, draftDate: w.date };
  } else if (kind === "meal") {
    const m = mealEntries.find(x => x.id === key);
    if (!m) return;
    editing = { kind, id: key, tempMealType: m.mealType, draftText: m.text, draftCalories: m.calories || "", draftDate: m.date,
      draftProtein: m.protein || "", draftFat: m.fat || "", draftCarb: m.carb || "" };
  }
  renderEditModal();
}

// Keep unsaved field values from being lost when a chip click (part/exercise/meal-type)
// forces the modal body to re-render.
function bindEditModalDraftInputs() {
  const map = {
    "edit-exercise": "draftExercise", "edit-reps": "draftReps", "edit-weight": "draftWeight",
    "edit-minutes": "draftMinutes", "edit-date": "draftDate", "edit-text": "draftText", "edit-calories": "draftCalories",
    "edit-protein": "draftProtein", "edit-fat": "draftFat", "edit-carb": "draftCarb",
  };
  Object.keys(map).forEach((id) => {
    const inp = document.getElementById(id);
    if (inp) inp.addEventListener("input", () => { editing[map[id]] = inp.value; });
  });
}

function handleEditSave() {
  if (editing.kind === "training") {
    const e = entries.find(x => x.id === editing.id);
    e.date = document.getElementById("edit-date").value || e.date;
    if (e.type === "strength") {
      e.part = editing.tempPart;
      e.exercise = document.getElementById("edit-exercise").value.trim();
      const reps = Number(document.getElementById("edit-reps").value);
      const weight = Number(document.getElementById("edit-weight").value);
      if (reps > 0) e.reps = reps;
      if (weight > 0) e.weight = weight;
    } else {
      const ex = document.getElementById("edit-exercise").value.trim();
      if (ex) e.exercise = ex;
      const minutes = Number(document.getElementById("edit-minutes").value);
      if (minutes > 0) e.minutes = minutes;
    }
  } else if (editing.kind === "weight") {
    const w = weightEntries.find(x => x.date === editing.date);
    const newDate = document.getElementById("edit-date").value || w.date;
    const newVal = parseFloat(document.getElementById("edit-weight").value);
    if (newVal > 0) {
      weightEntries = weightEntries.filter(x => x.date !== editing.date && x.date !== newDate);
      weightEntries.unshift({ date: newDate, weight: newVal });
    }
  } else if (editing.kind === "meal") {
    const m = mealEntries.find(x => x.id === editing.id);
    m.date = document.getElementById("edit-date").value || m.date;
    m.mealType = editing.tempMealType;
    const text = document.getElementById("edit-text").value.trim();
    if (text) m.text = text;
    const cal = document.getElementById("edit-calories").value;
    m.calories = cal ? Number(cal) : null;
    m.protein = Number(document.getElementById("edit-protein").value) || 0;
    m.fat = Number(document.getElementById("edit-fat").value) || 0;
    m.carb = Number(document.getElementById("edit-carb").value) || 0;
  }
  editing = null;
  saveState(); renderAll(); syncToSheet();
}

function handleEditDelete() {
  if (editing.kind === "training") entries = entries.filter(x => x.id !== editing.id);
  else if (editing.kind === "weight") weightEntries = weightEntries.filter(x => x.date !== editing.date);
  else if (editing.kind === "meal") mealEntries = mealEntries.filter(x => x.id !== editing.id);
  editing = null;
  saveState(); renderAll(); syncToSheet();
}

// ============ EVENTS ============
document.getElementById("tab-strength-btn").addEventListener("click", () => { currentTab = "strength"; renderTabs(); });
document.getElementById("tab-cardio-btn").addEventListener("click", () => { currentTab = "cardio"; renderTabs(); });
document.getElementById("save-btn").addEventListener("click", handleSave);
document.getElementById("date-input").value = localDateStr();
document.getElementById("date-input").addEventListener("change", () => {
  document.getElementById("header-date").textContent = document.getElementById("date-input").value;
});

document.getElementById("app").addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const action = t.dataset.action;
  const today = localDateStr();
  if (action === "select-part") { selectedPart = t.dataset.val; renderFormOptions(); }
  else if (action === "select-exercise") {
    document.getElementById("exercise-input").value = t.dataset.val;
    renderFormOptions();
  }
  else if (action === "select-cardio") { selectedCardio = t.dataset.val; renderFormOptions(); }
  else if (action === "select-meal-type") { selectedMealType = t.dataset.val; renderMealCard(); }
  else if (action === "add-weight") { handleAddWeight(); }
  else if (action === "add-meal") { handleAddMeal(); }
  else if (action === "del-weight") {
    weightEntries = weightEntries.filter(w => w.date !== t.dataset.date);
    saveState(); renderAll(); syncToSheet();
  }
  else if (action === "del-meal") {
    mealEntries = mealEntries.filter(m => m.id !== t.dataset.id);
    saveState(); renderAll(); syncToSheet();
  }
  else if (action === "del-training") {
    entries = entries.filter(x => x.id !== t.dataset.id);
    saveState(); renderAll(); syncToSheet();
  }
  else if (action === "edit-training") { openEdit("training", t.dataset.id); }
  else if (action === "edit-weight") { openEdit("weight", t.dataset.date); }
  else if (action === "edit-meal") { openEdit("meal", t.dataset.id); }
  else if (action === "view-list") { historyView = "list"; renderHistory(); }
  else if (action === "view-calendar") { historyView = "calendar"; renderHistory(); }
  else if (action === "cal-prev") { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); renderHistory(); }
  else if (action === "cal-next") { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); renderHistory(); }
  else if (action === "select-day") { selectedCalDate = t.dataset.date; renderHistory(); }
  else if (action === "reset-show") { confirmReset = true; renderReset(); }
  else if (action === "reset-no") { confirmReset = false; renderReset(); }
  else if (action === "reset-yes") {
    entries = []; weightEntries = []; mealEntries = []; confirmReset = false;
    saveState(); renderAll(); syncToSheet();
  }
  else if (action === "set-mood") { moodByDate[today] = t.dataset.val; saveState(); renderAiCard(); }
  else if (action === "quicklog-workout") {
    const w = pickWorkout(moodByDate[today]);
    currentTab = "cardio";
    renderTabs();
    selectedCardio = "その他";
    renderFormOptions();
    const customInput = document.getElementById("cardio-custom-input");
    customInput.value = w.name;
    document.getElementById("minutes-input").value = w.min;
    customInput.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  else if (action === "set-gender") { profile.gender = t.dataset.val; saveState(); renderAll(); }
  else if (action === "set-activity") { profile.activity = t.dataset.val; saveState(); renderAll(); }
  else if (action === "set-timeavail") { profile.timeAvail = t.dataset.val; saveState(); renderAll(); }
});
document.getElementById("sync-status").addEventListener("click", () => {
  if (syncStatus === "error") syncToSheet();
});

document.getElementById("modal-root").addEventListener("click", (e) => {
  if (e.target.id === "modal-overlay") { editing = null; renderEditModal(); return; }
  const t = e.target.closest("[data-edit-action]");
  if (!t) return;
  const action = t.dataset.editAction;
  if (action === "dismiss") { editing = null; renderEditModal(); }
  else if (action === "set-part") { editing.tempPart = t.dataset.val; renderEditModal(); }
  else if (action === "set-exercise") { editing.draftExercise = t.dataset.val; renderEditModal(); }
  else if (action === "set-mealtype") { editing.tempMealType = t.dataset.val; renderEditModal(); }
  else if (action === "save") { handleEditSave(); }
  else if (action === "delete") { handleEditDelete(); }
});

// ============ INIT ============
selectedCalDate = localDateStr();
loadState();
renderAll();
</script>
</body>
</html>
